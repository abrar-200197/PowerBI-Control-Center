name: $(Date:yyyyMMdd)$(Rev:.r) 

trigger:
  branches:
    include:
      - master
      
resources: 
  repositories: 
    - repository: pipeline_templates 
      type: git
      name: Infra-Cloud/infra-devops-pipelines 

variables:
  dockerRegistryServiceConnection: 'ashleyfurniture'
  imageRepository: 'afi/bi/powerbidocumentation'
  containerRegistry: 'ashleyfurniture.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: "Build and Push Docker Image"
    pool:
      name: "DevOps"
      demands:
        - Agent.OS -equals Linux
    jobs:
      - job: Build
        displayName: 'Build Docker Image'
        steps:
          # CRITICAL: Clear ALL Docker cache before build
          - script: |
              echo "🧹 Clearing Docker build cache..."
              docker builder prune -af --filter "until=1h"
              docker system prune -af --filter "until=1h"
              echo "✅ Cache cleared"
            displayName: 'Clear Docker Cache'

          - script: |
              echo "🔨 Building Docker image with ZERO cache..."
              BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              echo "Build Date: $BUILD_DATE"
              echo "Build ID: $(tag)"
              docker build --no-cache --pull \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg BUILD_ID="$(tag)" \
                -t $(containerRegistry)/$(imageRepository):$(tag) \
                -t $(containerRegistry)/$(imageRepository):latest \
                -f $(dockerfilePath) \
                $(Build.SourcesDirectory)
              echo "✅ Build complete with unique build args"
            displayName: 'Build Docker Image - Force Clean Build'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              containerRegistry: 'ashleyfurniture'
              command: 'login'

          - script: |
              docker push $(containerRegistry)/$(imageRepository):$(tag)
              docker push $(containerRegistry)/$(imageRepository):latest
            displayName: 'Push Docker Images'

  - stage: Deployment
    displayName: Deploy to Prod
    dependsOn: Build
    jobs:
      - deployment: Deploy
        environment: "Afi-BI-Analytics"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy and Restart Application'
                  inputs:
                    azureSubscription: 'AFI PROD'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying image: $(containerRegistry)/$(imageRepository):$(tag)"
                      
                      # Set container image
                      az webapp config container set \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --docker-custom-image-name $(containerRegistry)/$(imageRepository):$(tag) \
                        --docker-registry-server-url https://$(containerRegistry)
                      
                      # Enable managed identity for ACR
                      az webapp config set \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --generic-configurations '{"acrUseManagedIdentityCreds": true}'
                      
                      # Stop application
                      echo "Stopping application..."
                      az webapp stop \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg
                      
                      sleep 15
                      
                      # Start application
                      echo "Starting application with new container..."
                      az webapp start \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg
                      
                      sleep 30
                      
                      # Verify
                      STATUS=$(az webapp show \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --query state -o tsv)
                      
                      CURRENT_IMAGE=$(az webapp config show \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --query linuxFxVersion -o tsv)
                      
                      echo "App Status: $STATUS"
                      echo "Current Image: $CURRENT_IMAGE"
                      echo "Expected: DOCKER|$(containerRegistry)/$(imageRepository):$(tag)"
