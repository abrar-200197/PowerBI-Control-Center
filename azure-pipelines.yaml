name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master
      - main
      - github-main

resources:
  repositories:
    - repository: pipeline_templates
      type: git
      name: Infra-Cloud/infra-devops-pipelines

variables:
  dockerRegistryServiceConnection: 'ashleyfurniture'
  imageRepository: 'afi/bi/powerbidocumentation'
  containerRegistry: 'ashleyfurniture.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: "Build and Push Docker Image"
    pool:
      name: "DevOps"
      demands:
        - Agent.OS -equals Linux
    jobs:
      - job: Build
        displayName: 'Build Docker Image'
        steps:
          - script: |
              set -euo pipefail
              echo "Clearing Docker build cache..."
              docker builder prune -af --filter "until=1h" || true
              docker system prune -af --filter "until=1h" || true
              echo "Cache clear done"
            displayName: 'Clear Docker Cache'

          # P2 gates (2026-11-24): catch dependency-resolution breaks BEFORE the
          # Docker build/deploy — the 2026-11-23 httpx/mcp sidecar outage shipped
          # because a dev machine's installed set masked the resolver conflict —
          # and run the offline test suite (plain runners per repo convention).
          # Placeholder identity values keep app.py importable without a real
          # .env (msal validates the authority ALIAS at import; 'organizations'
          # is a public alias, not a secret). test_connector_pagination is
          # excluded: it performs live client-credentials auth.
          - task: UsePythonVersion@0
            displayName: 'Use Python 3.12 for offline checks'
            inputs:
              versionSpec: '3.12'

          - script: |
              set -euo pipefail
              python scripts/check-deps-resolution.py
            displayName: 'Dependency resolution check (clean venv + sidecar import)'

          - script: |
              set -euo pipefail
              python -m pip install --quiet --disable-pip-version-check -r requirements-dev.txt
              export TENANT_ID=organizations
              export CLIENT_ID=placeholder-client-id
              export CLIENT_SECRET=placeholder-client-secret
              export OPENAI_API_KEY=placeholder-openai-key
              for t in \
                tests/test_apppy_undefined_names.py \
                tests/test_catalog_fastpath_helpers.py \
                tests/test_crash_lineage_field_keys.py \
                tests/test_crash_schema_validation.py \
                tests/test_expression_parser.py \
                tests/test_pbir_field_walk.py \
                tests/test_powerbi_token_scoping.py \
                tests/test_webapp_acl.py \
                tests/test_mcp_acl.py \
                tests/test_mcp_user_acl.py \
                tests/test_mcp_thin_workspace_reports.py \
                tests/test_mcp_flask_proxy.py \
                test_crash_test_render_scan.py \
                ; do
                echo "== $t =="
                python "$t"
              done
            displayName: 'Offline test suite (no network / no SharePoint)'

          - script: |
              set -euo pipefail
              echo "Building Docker image (no cache)..."
              BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              IMAGE="$(containerRegistry)/$(imageRepository)"
              echo "Build Date: $BUILD_DATE"
              echo "Build ID: $(tag)"
              echo "Dockerfile: $(dockerfilePath)"
              test -f "$(dockerfilePath)"
              docker build --no-cache --pull \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg BUILD_ID="$(tag)" \
                -t "${IMAGE}:$(tag)" \
                -t "${IMAGE}:latest" \
                -f "$(dockerfilePath)" \
                "$(Build.SourcesDirectory)"
              echo "Build complete"
              docker images "${IMAGE}"
              docker image inspect "${IMAGE}:$(tag)" >/dev/null
              docker image inspect "${IMAGE}:latest" >/dev/null
            displayName: 'Build Docker Image - Force Clean Build'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              containerRegistry: 'ashleyfurniture'
              command: 'login'

          - script: |
              set -euo pipefail
              IMAGE="$(containerRegistry)/$(imageRepository)"
              echo "Local images before push:"
              docker images "${IMAGE}"
              docker image inspect "${IMAGE}:$(tag)" >/dev/null
              docker image inspect "${IMAGE}:latest" >/dev/null
              echo "Pushing ${IMAGE}:$(tag)"
              docker push "${IMAGE}:$(tag)"
              echo "Pushing ${IMAGE}:latest"
              docker push "${IMAGE}:latest"
              echo "Push complete"
            displayName: 'Push Docker Images'

  - stage: Deployment
    displayName: Deploy to Prod
    dependsOn: Build
    jobs:
      - deployment: Deploy
        environment: "Afi-BI-Analytics"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy and Restart Application'
                  inputs:
                    azureSubscription: 'AFI PROD'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      IMAGE="$(containerRegistry)/$(imageRepository):$(tag)"
                      echo "Deploying image: $IMAGE"

                      az webapp config container set \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --docker-custom-image-name "$IMAGE" \
                        --docker-registry-server-url "https://$(containerRegistry)"

                      az webapp config set \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --generic-configurations '{"acrUseManagedIdentityCreds": true}'

                      echo "Stopping application..."
                      az webapp stop \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg

                      sleep 15

                      echo "Starting application with new container..."
                      az webapp start \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg

                      sleep 30

                      STATUS=$(az webapp show \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --query state -o tsv)

                      CURRENT_IMAGE=$(az webapp config show \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --query linuxFxVersion -o tsv)

                      echo "App Status: $STATUS"
                      echo "Current Image: $CURRENT_IMAGE"
                      echo "Expected: DOCKER|$(containerRegistry)/$(imageRepository):$(tag)"

                      echo "Post-start smoke: waiting for /health to return 200..."
                      SMOKE_OK=0
                      for i in $(seq 1 20); do
                        sleep 15
                        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                          https://afi-powerbi-documentation-prod-app.azurewebsites.net/health || true)
                        echo "  attempt ${i}: HTTP ${HTTP_CODE}"
                        if [ "$HTTP_CODE" = "200" ]; then
                          SMOKE_OK=1
                          break
                        fi
                      done
                      if [ "$SMOKE_OK" = "1" ]; then
                        echo "Post-start smoke PASSED (/health 200)"
                      else
                        echo "Post-start smoke FAILED - /health never returned 200 within 5 minutes"
                        exit 1
                      fi
