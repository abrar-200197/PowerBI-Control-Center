name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - master
      - main
      - github-main

resources:
  repositories:
    - repository: pipeline_templates
      type: git
      name: Infra-Cloud/infra-devops-pipelines

variables:
  dockerRegistryServiceConnection: 'ashleyfurniture'
  imageRepository: 'afi/bi/powerbidocumentation'
  containerRegistry: 'ashleyfurniture.azurecr.io'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: "Build and Push Docker Image"
    pool:
      name: "DevOps"
      demands:
        - Agent.OS -equals Linux
    jobs:
      - job: Build
        displayName: 'Build Docker Image'
        steps:
          - script: |
              set -euo pipefail
              echo "Clearing Docker build cache..."
              docker builder prune -af --filter "until=1h" || true
              docker system prune -af --filter "until=1h" || true
              echo "Cache clear done"
            displayName: 'Clear Docker Cache'

          - script: |
              set -euo pipefail
              echo "Building Docker image (no cache)..."
              BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
              IMAGE="$(containerRegistry)/$(imageRepository)"
              echo "Build Date: $BUILD_DATE"
              echo "Build ID: $(tag)"
              echo "Dockerfile: $(dockerfilePath)"
              test -f "$(dockerfilePath)"
              docker build --no-cache --pull \
                --build-arg BUILD_DATE="$BUILD_DATE" \
                --build-arg BUILD_ID="$(tag)" \
                -t "${IMAGE}:$(tag)" \
                -t "${IMAGE}:latest" \
                -f "$(dockerfilePath)" \
                "$(Build.SourcesDirectory)"
              echo "Build complete"
              docker images "${IMAGE}"
              docker image inspect "${IMAGE}:$(tag)" >/dev/null
              docker image inspect "${IMAGE}:latest" >/dev/null
            displayName: 'Build Docker Image - Force Clean Build'

          - task: Docker@2
            displayName: 'Login to ACR'
            inputs:
              containerRegistry: 'ashleyfurniture'
              command: 'login'

          - script: |
              set -euo pipefail
              IMAGE="$(containerRegistry)/$(imageRepository)"
              echo "Local images before push:"
              docker images "${IMAGE}"
              docker image inspect "${IMAGE}:$(tag)" >/dev/null
              docker image inspect "${IMAGE}:latest" >/dev/null
              echo "Pushing ${IMAGE}:$(tag)"
              docker push "${IMAGE}:$(tag)"
              echo "Pushing ${IMAGE}:latest"
              docker push "${IMAGE}:latest"
              echo "Push complete"
            displayName: 'Push Docker Images'

  - stage: Deployment
    displayName: Deploy to Prod
    dependsOn: Build
    jobs:
      - deployment: Deploy
        environment: "Afi-BI-Analytics"
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureCLI@2
                  displayName: 'Deploy and Restart Application'
                  inputs:
                    azureSubscription: 'AFI PROD'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail
                      IMAGE="$(containerRegistry)/$(imageRepository):$(tag)"
                      echo "Deploying image: $IMAGE"

                      az webapp config container set \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --docker-custom-image-name "$IMAGE" \
                        --docker-registry-server-url "https://$(containerRegistry)"

                      az webapp config set \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --generic-configurations '{"acrUseManagedIdentityCreds": true}'

                      echo "Stopping application..."
                      az webapp stop \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg

                      sleep 15

                      echo "Starting application with new container..."
                      az webapp start \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg

                      sleep 30

                      STATUS=$(az webapp show \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --query state -o tsv)

                      CURRENT_IMAGE=$(az webapp config show \
                        --name afi-powerbi-documentation-prod-app \
                        --resource-group afi-bi-analytics-rg \
                        --query linuxFxVersion -o tsv)

                      echo "App Status: $STATUS"
                      echo "Current Image: $CURRENT_IMAGE"
                      echo "Expected: DOCKER|$(containerRegistry)/$(imageRepository):$(tag)"
