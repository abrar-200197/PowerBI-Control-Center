# Docs: https://github.com/Azure/webapps-deploy
# Target: afi-it-financials-automation-prod-app (code-only / Oryx, NOT Docker)

name: Build and deploy Python app to Azure Web App - afi-it-financials-automation-prod-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Build antenv HERE and deploy it with the app. Do not rely only on Oryx
      # remote pip — new packages (e.g. Copilot Studio SDK) were missing on prod
      # when antenv was excluded from the artifact.
      - name: Create venv and install dependencies
        run: |
          set -euo pipefail
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "from microsoft_agents.copilotstudio.client import CopilotClient; print('copilot sdk ok')"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !__pycache__/
            !.git/
            !data/catalog_cache/
            !data/catalog.sqlite
            !.env
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'afi-it-financials-automation-prod-app'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_46886C4F957C44A9B7E443CDD8B9A0C1 }}
