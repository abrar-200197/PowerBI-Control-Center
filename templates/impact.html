{% extends "base.html" %}
{% block title %}Impact Explorer - Power BI Control Center{% endblock %}
{% block page_heading %}Impact Explorer{% endblock %}
{% block page_subtitle %}EDW → report blast radius (precomputed catalog){% endblock %}

{% block content %}
<style>
  .impact-wrap {
    background: var(--bg-surface, #fff);
    border: 1px solid var(--border, #E2E8F0);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow-sm, 0 1px 2px rgba(15, 23, 42, 0.04));
  }
  .impact-frame {
    width: 100%;
    height: calc(100vh - 108px);
    min-height: 420px;
    border: 0;
    display: block;
    background: var(--bg-page, #F7FAFC);
  }
</style>

<div class="impact-wrap">
  <iframe id="impactFrame" class="impact-frame" title="Impact Explorer"
          src="/static/impact/index.html"></iframe>
</div>
{% endblock %}
